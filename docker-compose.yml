services:
  db:
    image: postgres:16-alpine
    container_name: webvory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: webvory
      POSTGRES_PASSWORD: webvory
      POSTGRES_DB: webvory
    ports:
      - "5432:5432"
    volumes:
      - webvory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webvory -d webvory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  webvory_pgdata:
